# Golden set for the fictional "Northwind Logistics" demo corpus (see demo-corpus/manifest.json).
#
# category:  answerable | unanswerable | acl_denied
# as_user:   alice = HR group, bob = Engineering group (see docs / dev principals)
# expected_facts:    every string must appear in a correct answer (normalised substring match)
# expected_sources:  file names, optionally "#pN" (PDF page) - retrieval recall@6 checks these
# forbidden_sources: (acl_denied) documents that must NEVER be retrieved for that user
# stale_facts:       older values from superseded documents; reported, not scored
# split:     dev = may be used to tune thresholds; holdout = report only (never tune on it)
#
# tests/test_eval_dataset.py checks every expected fact really occurs in its expected source.

