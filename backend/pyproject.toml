[project]
name = "grounded-rag-assistant"
version = "0.1.0"
description = "Document assistant that answers only from your documents, with citations."
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "redis>=5.2",
    "alembic>=1.20.0",
    "pgvector>=0.5.0",
    "arq>=0.28.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "trafilatura>=2.2.0",
    "defusedxml>=0.7.1",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
    "litellm>=1.103.0",
    "rapidfuzz>=3.14.6",
    "pyjwt[crypto]>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "testcontainers[postgres]>=4.15.0",
    "hypothesis>=6.168.3",
    "types-defusedxml>=0.7.0.20260504",
    "lxml-stubs>=0.5.1",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", ".."]

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*", "trafilatura", "trafilatura.*", "sentence_transformers", "sentence_transformers.*", "docx", "docx.*", "arq", "arq.*", "transformers", "transformers.*"]
ignore_missing_imports = true
disallow_untyped_calls = false
disallow_any_unimported = false

[[tool.mypy.overrides]]
module = ["app.ingestion.parsers.pdf", "app.ingestion.parsers.docx", "app.ingestion.embedding", "app.cli", "app.preview.render"]
disallow_untyped_calls = false
